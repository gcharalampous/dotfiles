# ── Terminal ───────────────────────────────────────────────
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ── Clipboard ─────────────────────────────────────────────
set -g set-clipboard on
set -g allow-passthrough on
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clipcopy"

# ── Mouse ─────────────────────────────────────────────────
set -g mouse on
